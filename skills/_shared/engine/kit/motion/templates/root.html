<!doctype html>
<html lang="{{LANG}}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width={{W}}, height={{H}}" />
    <title>{{TITLE}}</title>
    <script src="assets/js/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/css/base.css" />
    <link rel="stylesheet" href="assets/css/brand.css" />
    <style>
      @font-face { font-family: "Noto Kufi Arabic"; src: url("assets/fonts/NotoKufiArabic.ttf") format("truetype"); font-weight: 100 900; }
      @font-face { font-family: "Manrope"; src: url("assets/fonts/Manrope.ttf") format("truetype"); font-weight: 200 800; }
      @font-face { font-family: "Cairo"; src: url("assets/fonts/Cairo.ttf") format("truetype"); font-weight: 200 1000; }
      @font-face { font-family: "Montserrat"; src: url("assets/fonts/Montserrat.ttf") format("truetype"); font-weight: 100 900; }
      /* BRAND_FONTS (generated from <studio>/brand/fonts by new_motion_video.py) */
      html, body { width: {{W}}px; height: {{H}}px; }
      /* project-level overrides go here */
    </style>
  </head>
  <body>
    <!-- icon library: add <symbol>s here; scenes use <svg><use href="#i-name"/></svg> -->
    <svg width="0" height="0" style="position: absolute">
      <defs>
        <filter id="hblur" x="-50%" y="-20%" width="200%" height="140%"><feGaussianBlur id="hblur-g" stdDeviation="0 0" /></filter>
        <symbol id="i-check" viewBox="0 0 64 64"><path d="M14 33l12 12 24-26" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" /></symbol>
        <symbol id="i-x" viewBox="0 0 64 64"><path d="M20 20l24 24M44 20L20 44" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" /></symbol>
        <symbol id="i-spark" viewBox="0 0 64 64"><path d="M32 4c2 14 6 22 28 28-22 6-26 14-28 28-2-14-6-22-28-28 22-6 26-14 28-28z" fill="#fff" /></symbol>
        <symbol id="i-person" viewBox="0 0 48 56"><circle cx="24" cy="13" r="10" fill="currentColor" /><path d="M4 54c0-12 9-20 20-20s20 8 20 20z" fill="currentColor" /></symbol>
        <symbol id="i-bell" viewBox="0 0 64 64"><path d="M32 8c-11 0-18 8-18 19v11l-6 9h48l-6-9V27c0-11-7-19-18-19z" fill="currentColor" /><path d="M25 51a7 7 0 0014 0z" fill="currentColor" /></symbol>
        <symbol id="i-play" viewBox="0 0 64 64"><path d="M20 12l32 20-32 20z" fill="currentColor" /></symbol>
        <symbol id="i-like" viewBox="0 0 64 64"><path d="M8 28h10v28H8z" fill="currentColor" /><path d="M22 56V28L33 8c4-2 9 1 8 6l-3 12h15c4 0 7 4 6 8l-4 17c-1 3-4 5-7 5z" fill="currentColor" /></symbol>
        <symbol id="i-share" viewBox="0 0 64 64"><path d="M36 10l22 20-22 20V38C20 38 11 44 6 56c1-18 11-30 30-32z" fill="currentColor" /></symbol>
        <symbol id="i-chat" viewBox="0 0 64 64"><path d="M8 14c0-4 3-6 6-6h36c3 0 6 2 6 6v24c0 4-3 6-6 6H26l-12 10v-10c-3 0-6-2-6-6z" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linejoin="round" /></symbol>
        <symbol id="i-search" viewBox="0 0 64 64"><circle cx="27" cy="27" r="16" fill="none" stroke="currentColor" stroke-width="5" /><path d="M39 39l15 15" stroke="currentColor" stroke-width="6" stroke-linecap="round" /></symbol>
        <symbol id="i-cursor" viewBox="0 0 70 90"><path d="M6 4l58 50-26 4 14 26-12 5-14-26-20 18z" fill="#0d0d0d" stroke="#fff" stroke-width="5" stroke-linejoin="round" /></symbol>
      </defs>
    </svg>

    <div id="root" data-preset="{{PRESET}}" data-dir="{{DIR}}" data-composition-id="main" data-start="0" data-duration="{{DURATION}}" data-width="{{W}}" data-height="{{H}}" data-fps="30">
      <!-- HOSTS:BEGIN (generated by pipeline/motion_sync.py from scenes.json) -->
      <!-- HOSTS:END -->

      <div id="wipe"></div>
      <div id="chrome">
        <div class="tl"><span class="sq"></span><span>{{BRAND_TAG}}</span><span class="ser"></span></div>
        <div class="tr"><span class="lab"></span><span class="cnt"></span></div>
        <i class="crop a"></i><i class="crop b"></i><i class="crop c"></i><i class="crop d"></i>
        <div class="prog"><b></b></div>
        <div class="tc">00:00</div>
      </div>
      <div id="flash"></div>
      <div id="vignette"></div>
      <div id="grain"></div>

      <!-- AUDIO:BEGIN (generated by pipeline/motion_sync.py from cues.json) -->
      <!-- AUDIO:END -->
    </div>

    <script src="assets/js/fx.js"></script>
    <script src="assets/js/motion-blur.js"></script>
    <script>
      (function () {
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#flash", { opacity: 0 }, { opacity: 0, duration: 0.01 }, 0);
        window.HF_GRAIN(tl, {{DURATION}});
        // CHROME:BEGIN (generated)
        window.HF_CHROME(tl, { enabled: true, series: "", duration: {{DURATION}}, sections: [] });
        // CHROME:END
        // WIPES:BEGIN (generated)
        // WIPES:END
        // STEPS:BEGIN (generated)
        // STEPS:END
        // root-level moments (flashes, global transitions) go below, in GLOBAL seconds
        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
</html>
