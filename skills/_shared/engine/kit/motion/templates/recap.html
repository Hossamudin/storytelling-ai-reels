<!doctype html>
<html lang="ar"><head><meta charset="UTF-8" /></head><body>
<!--
  End-of-section recap card ("what you just learned"). Pair with a silent "hold" (voice paused) or play it
  under a summary sentence. scenes.json:
    {"id": "r1", "start": 100.9, "duration": 5.0, "template": "recap",
     "data": {"LABEL": "RECAP · 02 PAGES", "TITLE": "اللي اتعلمناه", "P1": "...", "P2": "...", "P3": "..."}}
-->
<template id="{{ID}}-template">
  <style>
    #{{ID}}-lab { top: 170px; }
    #{{ID}}-t { top: 220px; }
    #{{ID}}-list { position: absolute; left: 14%; right: 14%; top: 420px; display: flex; flex-direction: column; gap: 26px; direction: rtl; }
    .{{ID}}-p { display: flex; align-items: center; gap: 22px; font-size: 46px; font-weight: 800; line-height: 1.35; }
    .{{ID}}-p .ck { flex: none; width: 58px; height: 58px; border-radius: 50%; background: var(--green); display: flex; align-items: center; justify-content: center; color: #fff; }
  </style>
  <div id="{{ID}}" data-composition-id="{{ID}}" data-width="{{W}}" data-height="{{H}}" data-duration="{{DUR}}">
    <div class="bg"></div>
    <div id="{{ID}}-dots" class="dots"></div>
    <div id="{{ID}}-cam" class="cam">
      <div id="{{ID}}-lab" class="row"><span class="t-label" data-layout-allow-overlap>{{LABEL}}</span></div>
      <div id="{{ID}}-t" class="row t-h1" data-layout-allow-overlap><span class="mask"><span class="in" id="{{ID}}-ti">{{TITLE}}</span></span></div>
      <div id="{{ID}}-list">
        <div class="{{ID}}-p" id="{{ID}}-p1"><span class="ck"><svg width="30" height="30"><use href="#i-check" /></svg></span><span data-layout-allow-overlap>{{P1}}</span></div>
        <div class="{{ID}}-p" id="{{ID}}-p2"><span class="ck"><svg width="30" height="30"><use href="#i-check" /></svg></span><span data-layout-allow-overlap>{{P2}}</span></div>
        <div class="{{ID}}-p" id="{{ID}}-p3"><span class="ck"><svg width="30" height="30"><use href="#i-check" /></svg></span><span data-layout-allow-overlap>{{P3}}</span></div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      const T0 = {{START}};
      const fx = window.HF_SCENE(T0);
      fx.drift("#{{ID}}-dots", T0, {{DUR}}, -40, 30);
      fx.pushIn("#{{ID}}-cam", T0, {{DUR}}, 1.03);
      fx.rise("#{{ID}}-lab", T0 + 0.1, { y: 20 });
      fx.maskUp("#{{ID}}-ti", T0 + 0.2);
      fx.rise(["#{{ID}}-p1", "#{{ID}}-p2", "#{{ID}}-p3"], T0 + 0.7, { x: 0, y: 30, st: 0.35 });
      window.__timelines["{{ID}}"] = fx.tl.real;
    })();
  </script>
</template></body></html>
