      /* ===== Agent Harness world: engine core + harness chassis ===== */
      .ah-core { position: absolute; border-radius: 50%; background: radial-gradient(circle at 50% 42%, #fffbe0 0%, #ffec5c 26%, #ff9a3c 58%, #ff5a33 80%, #c8401f 100%);
        box-shadow: 0 0 0 8px rgba(255,236,92,.18), 0 0 60px rgba(255,236,92,.55), 0 0 160px rgba(255,90,51,.45); }
      .ah-bloom { position: absolute; border-radius: 50%; background: radial-gradient(circle, rgba(255,236,92,.55) 0%, rgba(255,90,51,.22) 40%, transparent 70%); pointer-events: none; }
      .ah-gear { position: absolute; inset: -18%; width: 136%; height: 136%; }
      .ah-tag { position: absolute; font-family: var(--font-en); font-weight: 900; letter-spacing: .2em; font-size: 26px; color: var(--lime); direction: ltr; white-space: nowrap; }
      .ah-en { font-family: var(--font-en); direction: ltr; unicode-bidi: isolate; font-weight: 900; }
      .ah-code { position: absolute; border-radius: 24px; background: #031210; border: 2px solid rgba(179,206,101,.35); box-shadow: 0 24px 60px rgba(0,0,0,.45); padding: 34px 34px; direction: ltr; overflow: hidden; }
      .ah-ln { display: block; height: 18px; border-radius: 9px; margin: 0 0 20px; }
      .ah-file { position: absolute; width: 230px; height: 280px; border-radius: 22px; background: rgba(255,255,255,.06); border: 3px solid rgba(179,206,101,.55);
        display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 26px; }
      .ah-file::before { content: ""; position: absolute; top: 34px; left: 34px; right: 34px; height: 110px; border-radius: 10px;
        background: repeating-linear-gradient(180deg, rgba(246,248,240,.25) 0 12px, transparent 12px 26px); }
      .ah-file b { font-family: var(--font-en); font-size: 26px; font-weight: 800; letter-spacing: .06em; color: var(--fg); direction: ltr; }
      .ah-brk { position: absolute; width: 150px; height: 150px; border-color: var(--lime); border-style: solid; border-width: 0; filter: drop-shadow(0 0 18px rgba(179,206,101,.55)); }
      .ah-brk.a { border-top-width: 16px; border-left-width: 16px; border-top-left-radius: 40px; }
      .ah-brk.b { border-top-width: 16px; border-right-width: 16px; border-top-right-radius: 40px; }
      .ah-brk.c { border-bottom-width: 16px; border-left-width: 16px; border-bottom-left-radius: 40px; }
      .ah-brk.d { border-bottom-width: 16px; border-right-width: 16px; border-bottom-right-radius: 40px; }
      .ah-mod { position: absolute; height: 84px; padding: 0 30px; border-radius: 42px; background: #0b2f29; border: 3px solid var(--lime); color: var(--fg);
        display: inline-flex; align-items: center; gap: 14px; font-size: 38px; font-weight: 800; white-space: nowrap; }
      .ah-mod .ic { width: 48px; height: 48px; border-radius: 50%; background: var(--lime); color: var(--ink); display: flex; align-items: center; justify-content: center; }
      .ah-track { position: absolute; height: 34px; border-radius: 17px; background: rgba(255,255,255,.08); overflow: hidden; }
      .ah-fill { position: absolute; top: 0; bottom: 0; right: 0; width: 100%; border-radius: 17px; transform-origin: 100% 50%; }
      .ah-chassis { position: absolute; border-radius: 40px; border: 4px solid var(--lime); background: linear-gradient(180deg, rgba(179,206,101,.10), rgba(179,206,101,.02));
        box-shadow: 0 0 40px rgba(179,206,101,.18) inset; }
      .ah-chassis .nm { position: absolute; top: -28px; left: 50%; transform: translateX(-50%); padding: 6px 26px; border-radius: 24px; background: var(--lime); color: var(--ink);
        font-family: var(--font-en); font-size: 30px; font-weight: 900; letter-spacing: .04em; white-space: nowrap; direction: ltr; }
      .ah-q { position: absolute; font-family: var(--font-ar); font-weight: 900; color: rgba(179,206,101,.08); }
      .ah-y { color: var(--yellow); }
      .ah-o { color: var(--orange); }
      .ah-l { color: var(--lime); }
