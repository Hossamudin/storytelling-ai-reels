      :root {

        --yellow: #ffec5c;
        --orange: #ff5a33;
        --red: #d93a2b;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--paper);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--paper);
        font-family: "Noto Kufi Arabic", sans-serif;
        direction: rtl;
        color: var(--ink);
      }
      .lat {
        font-family: "Manrope", sans-serif;
        direction: ltr;
        unicode-bidi: isolate;
      }
      .scene {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      .fill {
        position: absolute;
        inset: 0;
      }
      .paper {
        background: var(--paper);
      }
      .tealbg {
        background: radial-gradient(ellipse 80% 70% at 50% 45%, #1a7564 0%, var(--teal) 55%, var(--teal2) 100%);
      }
      .dots {
        position: absolute;
        inset: -220px;
        background-image: radial-gradient(circle, rgba(19, 96, 82, 0.2) 2.4px, transparent 2.9px);
        background-size: 52px 52px;
      }
      .dots.lite {
        background-image: radial-gradient(circle, rgba(179, 206, 101, 0.16) 2.4px, transparent 2.9px);
      }
      .cam {
        position: absolute;
        inset: 0;
        transform-origin: 50% 50%;
      }
      .abs {
        position: absolute;
      }
      .row {
        position: absolute;
        left: 0;
        right: 0;
        text-align: center;
        line-height: 1.3;
      }
      .w {
        display: inline-block;
      }
      .glow {
        position: absolute;
        border-radius: 50%;
        pointer-events: none;
      }
      .hl {
        position: relative;
        isolation: isolate;
        display: inline-block;
        padding: 0 22px;
      }
      .hl > .band {
        position: absolute;
        inset: 12% -4px 8% -4px;
        border-radius: 14px;
        transform-origin: 100% 50%;
      }
      .hl > .txt {
        position: relative;
        display: inline-block;
      }
      svg.ic {
        overflow: visible;
      }
      .stroke {
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }      .node {
        position: absolute;
        border-radius: 50%;
        background: radial-gradient(circle at 50% 45%, #fff6b8 0%, var(--yellow) 30%, var(--orange) 78%, #e8452a 100%);

        align-items: center;
        justify-content: center;

        height: 46%;
      }      #flash {

      }

    <script>
      (function () {
        const tl = gsap.timeline({ paused: true });
        const Q = (s) => document.querySelector(s);
        tl.fromTo("#flash", { opacity: 0 }, { opacity: 0, duration: 0.01 }, 0);
        // grain: stepped, finite, deterministic
        const GP = [[0, 0], [-5, -5], [-10, 5], [5, -10], [-5, 15], [-10, 5], [15, 0], [0, 10], [-15, 0], [10, 5]];
        const gObj = { i: 0 };
        const grain = Q("#grain");
        tl.fromTo(gObj, { i: 0 }, { i: 220, duration: 22, ease: "none", onUpdate: () => {
          const p = GP[Math.floor(gObj.i) % GP.length];
          grain.style.transform = `translate(${p[0]}%, ${p[1]}%)`;
        } }, 0);
        window.__timelines["main"] = tl;
      })();
    </script>
