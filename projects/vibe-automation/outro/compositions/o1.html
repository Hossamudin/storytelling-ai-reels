      <script>
        (function () {
          const { tl, Q, QA, rise, pop, out, draw, band, shake, breathe, drift } = window.HF_SCENE(0);
          drift("#o1-bgp", 0, 6.0, 60, -20);
          tl.fromTo("#o1-cam", { scale: 1.12 }, { scale: 1, duration: 1.0, ease: "expo.out" }, 0);
          rise("#o1-k1", 0.46, { y: 50 });
          rise("#o1-k2", 1.3, { y: 50, s: 1.15 });
          rise("#o1-s1", 1.66, { y: 30 });
          rise("#o1-s2", 2.32, { y: 30 });
          band("#o1-b2", 2.4, 0.35);
          rise("#o1-s3", 2.72, { y: 30 });
          band("#o1-b3", 2.8, 0.35);
          // like / share / friends
          pop("#o1-like", 3.5, { from: 0.3 });
          rise("#o1-likel", 3.6, { y: 20 });
          tl.fromTo("#o1-likef", { scale: 0 }, { scale: 1, duration: 0.3, ease: "back.out(2)" }, 4.04);
          tl.fromTo("#o1-likei", { color: "#136052" }, { color: "#ffffff", duration: 0.15, immediateRender: false }, 4.08);
          tl.fromTo("#o1-like", { scale: 1 }, { scale: 1.16, duration: 0.14, yoyo: true, repeat: 1, ease: "power2.out", immediateRender: false }, 4.04);
          tl.fromTo("#o1-likei", { rotation: 0 }, { rotation: -14, duration: 0.14, yoyo: true, repeat: 1, ease: "power2.out", immediateRender: false }, 4.04);
          tl.fromTo("#o1-rays", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1.25, duration: 0.3, ease: "power2.out" }, 4.06);
          tl.to("#o1-rays", { opacity: 0, duration: 0.3 }, 4.36);
          tl.fromTo("#o1-plus", { opacity: 0, y: 30 }, { opacity: 1, y: -40, duration: 0.5, ease: "power2.out" }, 4.1);
          tl.to("#o1-plus", { opacity: 0, y: -80, duration: 0.4 }, 4.9);
          tl.fromTo("#o1-glow", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.6, ease: "power2.out" }, 4.06);
          pop("#o1-share", 3.8, { from: 0.3 });
          rise("#o1-sharel", 3.9, { y: 20 });
          tl.fromTo("#o1-sharef", { scale: 0 }, { scale: 1, duration: 0.3, ease: "back.out(2)" }, 4.28);
          tl.fromTo("#o1-sharei", { color: "#136052" }, { color: "#ffffff", duration: 0.15, immediateRender: false }, 4.32);
          // paper plane flies the arc to the friends
          tl.fromTo("#o1-arc", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 4.32);
          const plane = { p: 0 };
          const P = Q("#o1-plane");
          const arc = Q("#o1-arc");
          const L = arc.getTotalLength();
          tl.fromTo(
            plane,
            { p: 0 },
            {
              p: 1,
              duration: 0.55,
              ease: "power2.inOut",
              onUpdate: () => {
                const a = arc.getPointAtLength(plane.p * L);
                const b = arc.getPointAtLength(Math.min(L, plane.p * L + 4));
                const ang = (Math.atan2(b.y - a.y, b.x - a.x) * 180) / Math.PI;
                P.style.transform = `translate(${a.x - 960}px, ${a.y - 455}px) rotate(${ang - 20}deg)`;
                P.style.opacity = plane.p <= 0.001 ? "0" : plane.p > 0.97 ? String((1 - plane.p) * 30) : "1";
              },
            },
            4.34,
          );
          tl.fromTo("#o1-plane", { opacity: 0 }, { opacity: 0, duration: 0.01 }, 0);
          tl.fromTo(["#o1-f1", "#o1-f2", "#o1-f3"], { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2.2)", stagger: 0.08 }, 4.62);
          rise("#o1-frl", 4.74, { y: 20 });
          pop("#o1-frck", 5.28, { from: 0.2 });
          // exit: lift up
          tl.to("#o1-cam", { y: -260, opacity: 0, filter: "blur(10px)", duration: 0.4, ease: "power3.in" }, 5.6);
          window.__timelines["o1"] = tl.real;
        })();
