      </style>
      <div data-hf-id="hf-agzg" id="s6" data-composition-id="s6" data-width="1920" data-height="1080" data-duration="10.4">
        <div data-hf-id="hf-6h2b" id="s6-wrap" class="fill">
          <div data-hf-id="hf-2foy" class="fill tealbg"></div>
          <div data-hf-id="hf-uhwp" id="s6-bgp" class="dots lite"></div>
          <div data-hf-id="hf-o7se" id="s6-cam" class="cam">
            <div data-hf-id="hf-tfq8" id="s6-bloom" class="glow"></div>
            <div data-hf-id="hf-a6qw" id="s6-top" class="fill">
              <div data-hf-id="hf-sxzo" id="s6-kick" class="row"><span data-hf-id="hf-y5ws" class="w" id="s6-k1">في الفيديو ده</span> <span data-hf-id="hf-zdgg" class="w" id="s6-k2">هنشوف مع بعض</span></div>
              <div data-hf-id="hf-2kg3" id="s6-title" class="row lat"></div>
              <div data-hf-id="hf-urxn" id="s6-steps" class="row"><span data-hf-id="hf-oe9v" class="w" id="s6-st">٦ خطوات</span></div>

              <div data-hf-id="hf-mtok" class="chip">٢</div>
              <div data-hf-id="hf-mfdj" class="chip">٣</div>
              <div data-hf-id="hf-nmam" class="chip">٤</div>
              <div data-hf-id="hf-n7zl" class="chip">٥</div>
              <div data-hf-id="hf-oewo" class="chip">٦</div>
            </div>
            <div data-hf-id="hf-zbaz" id="s6-diag" class="abs">
              <svg data-hf-id="hf-a93y" class="abs" style="left: 0; top: 0" width="1920" height="460" viewBox="0 0 1920 460">
                <path data-hf-id="hf-fbz6" id="s6-arrow" d="M1360 205 C 1240 160, 1120 160, 1010 205" pathLength="1" fill="none" stroke="#FF5A33" stroke-width="10" stroke-linecap="round" stroke-dasharray="1" stroke-dashoffset="1" />
                <path data-hf-id="hf-tp51" id="s6-head" d="M1040 172 L1006 207 L1052 222" fill="none" stroke="#FF5A33" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
                <g data-hf-id="hf-b4i5" id="s6-links" stroke="#B3CE65" stroke-width="4" opacity=".85" />
              </svg>
              <div data-hf-id="hf-4ahj" id="s6-idea" class="node"><svg data-hf-id="hf-vwu9"><use data-hf-id="hf-iqr9" href="#i-spark" /></svg></div>
              <div data-hf-id="hf-xgd3" class="s6lbl y" id="s6-ideal" style="left: 1265px; top: 285px">أي فكرة عندك</div>
              <div data-hf-id="hf-56qc" id="s6-net"></div>
              <div data-hf-id="hf-zkgy" class="s6lbl" id="s6-netl" style="left: 340px; top: 370px; width: 700px; white-space: nowrap">
                نظام متكامل
                <span data-hf-id="hf-34lq" id="s6-plus" style="color: var(--yellow)">+ فريق <span data-hf-id="hf-ex0q" class="lat">AI</span></span>
              </div>
            </div>
          </div>
        </div>
      </div>
      <script>
        (function () {
          const { tl, Q, QA, rise, pop, out, draw, band, shake, breathe, drift } = window.HF_SCENE(44.6);
        const title = Q("#s6-title");
        const words = ["Vibe", " ", "Automation"];
        let html = "";
        words.forEach((wd, wi) => {
          if (wd === " ") html += '<span class="ch">&nbsp;</span>';
          else html += wd.split("").map((c) => `<span class="ch w${wi}">${c}</span>`).join("");
        });
        title.innerHTML = html;
        drift("#s6-bgp", 44.6, 10.4, 80, 20);
        tl.fromTo("#s6-cam", { scale: 1.35 }, { scale: 1, duration: 1.0, ease: "expo.out" }, 44.6);
        rise("#s6-k1", 44.72, { y: 30 });
        rise("#s6-k2", 45.95, { y: 30 });
        tl.fromTo("#s6-bloom", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 1.0, ease: "power2.out" }, 46.6);
        breathe("#s6-bloom", 47.6, 7.0, 0.06, 1.8);
        tl.fromTo(".w0", { opacity: 0, y: 90, rotationX: -80, transformPerspective: 700, filter: "blur(14px)" }, { opacity: 1, y: 0, rotationX: 0, filter: "blur(0px)", duration: 0.55, ease: "back.out(1.8)", stagger: 0.04 }, 46.72);
        tl.fromTo(".w2", { opacity: 0, y: 90, rotationX: -80, transformPerspective: 700, filter: "blur(14px)" }, { opacity: 1, y: 0, rotationX: 0, filter: "blur(0px)", duration: 0.55, ease: "back.out(1.8)", stagger: 0.035 }, 47.28);
        tl.fromTo("#s6-st", { opacity: 0, scale: 2.2 }, { opacity: 1, scale: 1, duration: 0.3, ease: "expo.out" }, 48.48);
        tl.fromTo("#s6-chips .chip", { opacity: 0, y: 60, scale: 0.5 }, { opacity: 1, y: 0, scale: 1, duration: 0.4, ease: "back.out(2)", stagger: 0.07 }, 48.55);
        // make room for the idea -> system diagram
        tl.to("#s6-top", { y: -150, scale: 0.78, duration: 0.6, ease: "power3.inOut" }, 49.3);
        out("#s6-chips", 49.3, { y: 40, d: 0.4 });
        tl.fromTo("#s6-diag", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 49.55);
        tl.fromTo("#s6-idea", { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(2.6)" }, 49.6);
        rise("#s6-ideal", 50.78, { y: 30 });
        tl.fromTo("#s6-arrow", { strokeDasharray: 1, strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.45, ease: "power2.inOut" }, 51.25);
        tl.fromTo("#s6-head", { opacity: 0 }, { opacity: 1, duration: 0.15 }, 51.62);
        // network (system)
        const net = Q("#s6-net");
        const links = Q("#s6-links");
        const NC = [690, 205];
        const NP = [[0, 0]];
        for (let i = 0; i < 6; i++) {
          const a = ((i * 60 - 90) * Math.PI) / 180;
          NP.push([Math.round(Math.cos(a) * 150), Math.round(Math.sin(a) * 140)]);
        }
        NP.forEach(([dx, dy], i) => {
          const n = document.createElement("div");
          n.className = "netn";
          n.id = `nn${i}`;
          n.style.cssText = `left:${NC[0] + dx - 32}px;top:${NC[1] + dy - 32}px`;
          net.appendChild(n);
          const g = document.createElement("div");
          g.className = "node netg";
          g.id = `ng${i}`;
          g.style.cssText = `left:${NC[0] + dx - 32}px;top:${NC[1] + dy - 32}px;width:64px;height:64px`;
          g.innerHTML = '<svg><use href="#i-spark"/></svg>';
          net.appendChild(g);
          if (i > 0) {
            const ln = document.createElementNS("http://www.w3.org/2000/svg", "line");
            ln.setAttribute("x1", NC[0]);
            ln.setAttribute("y1", NC[1]);
            ln.setAttribute("x2", NC[0] + dx);
            ln.setAttribute("y2", NC[1] + dy);
            ln.setAttribute("pathLength", "1");
            ln.setAttribute("class", "nl");
            links.appendChild(ln);
            const nx = NP[i === 6 ? 1 : i + 1];
            const l2 = document.createElementNS("http://www.w3.org/2000/svg", "line");
            l2.setAttribute("x1", NC[0] + dx);
            l2.setAttribute("y1", NC[1] + dy);
            l2.setAttribute("x2", NC[0] + nx[0]);
            l2.setAttribute("y2", NC[1] + nx[1]);
            l2.setAttribute("pathLength", "1");
            l2.setAttribute("class", "nl");
            links.appendChild(l2);
          }
        });
        tl.fromTo(".netn", { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2.4)", stagger: 0.05 }, 51.6);
        tl.fromTo(".nl", { strokeDasharray: 1, strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.4, ease: "power2.out", stagger: 0.02 }, 51.75);
        tl.fromTo("#s6-netl", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 51.9);
        tl.fromTo("#s6-plus", { opacity: 0 }, { opacity: 0, duration: 0.01 }, 51.9);
        tl.fromTo(".netg", { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2.6)", stagger: 0.06 }, 52.72);
        tl.to("#s6-plus", { opacity: 1, duration: 0.35 }, 52.9);
        tl.to("#s6-cam", { scale: 1.05, duration: 1.6, ease: "power1.inOut" }, 52.7);
        tl.to("#s6-cam", { x: 900, filter: "blur(14px)", duration: 0.45, ease: "power3.in" }, 54.4);
          window.__timelines["s6"] = tl.real;
        })();
      </script>
    </template>
  </body>
</html>
