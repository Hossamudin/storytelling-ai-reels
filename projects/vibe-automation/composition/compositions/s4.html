      <script>
        (function () {
          const { tl, Q, QA, rise, pop, out, draw, band, shake, breathe, drift } = window.HF_SCENE(15.95);
        const cx = 960,
          cy = 500,
          R = 290;
        const kids = Q("#s4-kids");
        for (let i = 0; i < 6; i++) {
          const a = ((i * 60 - 90) * Math.PI) / 180;
          const n = document.createElement("div");
          n.className = "node s4-kid";
          n.style.cssText = `left:${cx - 50}px;top:${cy - 50}px;width:100px;height:100px`;
          n.innerHTML = '<svg><use href="#i-spark"/></svg>';
          n.dataset.x = Math.round(Math.cos(a) * R);
          n.dataset.y = Math.round(Math.sin(a) * R);
          kids.appendChild(n);
        }
        drift("#s4-bgp", 15.95, 5.0, -40, 30);
        tl.fromTo("#s4-cam", { scale: 0.85, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.6, ease: "expo.out" }, 15.95);
        rise("#s4-a", 15.98, { y: 30 });
        pop("#s4-b", 17.0, { from: 0.2 });

        tl.fromTo("#s4-bloom", { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.8, ease: "power2.out" }, 17.02);
        breathe("#s4-bloom", 17.85, 3.0, 0.08, 1.3);
        QA(".s4-kid").forEach((n, i) => {
          tl.fromTo(n, { x: 0, y: 0, scale: 0.2, opacity: 0 }, { x: +n.dataset.x, y: +n.dataset.y, scale: 1, opacity: 1, duration: 0.6, ease: "back.out(1.7)" }, 17.9 + i * 0.05);
        });
        draw(".s4-sp", 18.05, 0.4, "power2.out");
        draw("#s4-poly", 18.3, 0.7, "power2.inOut");
        tl.fromTo("#s4-ring", { rotation: 0 }, { rotation: 20, duration: 2.6, ease: "none" }, 18.3);
        tl.fromTo("#s4-kids", { rotation: 0 }, { rotation: 20, duration: 2.6, ease: "none" }, 18.3);
        tl.fromTo("#s4-core", { scale: 1 }, { scale: 1.18, duration: 0.18, yoyo: true, repeat: 1, ease: "power2.out", immediateRender: false }, 18.9);
        tl.fromTo("#s4-core", { scale: 1 }, { scale: 1.18, duration: 0.18, yoyo: true, repeat: 1, ease: "power2.out", immediateRender: false }, 19.3);

        tl.to("#s4-cam", { x: 900, filter: "blur(14px)", duration: 0.45, ease: "power3.in" }, 20.5);
