          [10, 5],
        ];
        const gsteps = Math.floor(67.2 / 0.1);
        const gObj = { i: 0 };
        const grain = Q("#grain");
        tl.fromTo(
          gObj,
          { i: 0 },
          {
            i: gsteps,
            duration: 67.2,
            ease: "none",
            onUpdate: () => {
              const p = GP[Math.floor(gObj.i) % GP.length];
              grain.style.transform = `translate(${p[0]}%, ${p[1]}%)`;
            },
          },
          0,
        );

        window.__timelines["main"] = tl;
      
      })();
    </script>
  </body>
</html>
