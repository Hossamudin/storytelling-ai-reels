<!doctype html>
<html lang="ar"><head><meta charset="UTF-8" /></head><body>
<template id="s2-template">
  <style>

    .s2-st { position: absolute; top: 640px; width: 220px; height: 220px; border-radius: 40px; border: 4px dashed rgba(179,206,101,.5);
      display: flex; align-items: center; justify-content: center; font-family: var(--font-en); font-weight: 900; font-size: 90px; color: var(--fg-muted); }
    #s2-n1 { left: 760px; } #s2-n2 { left: 430px; } #s2-n3 { left: 100px; }
    #s2-nm { left: 0; right: 0; top: 1300px; text-align: center; font-family: var(--font-en); font-weight: 900; font-size: 170px; color: var(--fg); direction: ltr; }

  </style>
  <div id="s2" data-composition-id="s2" data-width="1080" data-height="1920" data-duration="5.5">
    <div class="bg"></div>
    <div id="s2-blob" class="blob" style="left:160px; top:520px; width:760px; height:760px; background:#0f4f44; opacity:.55"></div>
    <div id="s2-bgp" class="dots"></div>
    <div id="s2-cam" class="cam">

      <div id="s2-lab" class="row" style="top:300px"><span class="t-label" style="color:var(--lime)">FREE AI TOOLS · PART 1</span></div>
      <div class="row t-h2" style="top:350px;" data-layout-allow-overlap><span class="mask"><span class="in" id="s2-a1">أدوات AI ببلاش</span></span></div>
      <div id="s2-n1" class="s2-st">01</div><div id="s2-n2" class="s2-st">02</div><div id="s2-n3" class="s2-st">03</div>
      <div class="row t-h3" style="top:1000px;" data-layout-allow-overlap><span class="mask"><span class="in" id="s2-b1">والأولى معانا اسمها</span></span></div>
      <div id="s2-nm" class="abs">Whacka</div>

    </div>
  </div>
  <script>
    (function () {
      const fx = window.HF_SCENE(7.45);
      const { tl } = fx;
      fx.drift("#s2-bgp", 7.45, 5.5, 60, -40);
      fx.drift("#s2-blob", 7.45, 5.5, -110, 60);
      fx.pushIn("#s2-cam", 7.45, 5.5, 1.035);

      fx.rise("#s2-lab", 7.5, { y: 16 });
      fx.maskUp("#s2-a1", 9.0);
      fx.pop("#s2-n1", 7.9); fx.pop("#s2-n2", 8.05); fx.pop("#s2-n3", 8.2);
      tl.to("#s2-n1", { borderStyle: "solid", borderColor: "#ffec5c", background: "#ffec5c", color: "#0d0d0d", scale: 1.12, duration: 0.3, ease: "back.out(2)" }, 10.7);
      fx.maskUp("#s2-b1", 10.7);
      fx.letterDrop("#s2-nm", 12.1, { st: 0.05 });

      tl.to("#s2-cam", { opacity: 0, filter: "blur(10px)", duration: 0.22, ease: "power2.in" }, 12.51);
      window.__timelines["s2"] = tl.real;
    })();
  </script>
</template></body></html>
