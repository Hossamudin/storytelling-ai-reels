<!doctype html>
<html lang="ar"><head><meta charset="UTF-8" /></head><body>
<template id="s1-template">
  <style>
    #s1-lab { top: 520px; }
    #s1-t { top: 580px; font-size: 150px; font-weight: 900; letter-spacing: -2px; color: var(--fg); }
    #s1-sub { top: 800px; }
    #s1-st { left: 390px; top: 960px; }
    #s1-num { top: 1230px; font-size: 200px; font-weight: 900; }
    #s1-numl { top: 1580px; }
    #s1-glow { left: 90px; top: 380px; width: 900px; height: 700px; background: radial-gradient(ellipse, var(--glow-a), transparent 68%); }
  </style>
  <div id="s1" data-composition-id="s1" data-width="1080" data-height="1920" data-duration="5.9">
    <div class="bg"></div>
    <div id="s1-bgp" class="dots"></div>
    <div id="s1-blob" class="blob" style="left: 600px; top: 200px; width: 500px; height: 500px; background: var(--glow-b)"></div>
    <div id="s1-cam" class="cam">
      <div id="s1-glow" class="glow"></div>
      <div id="s1-lab" class="row"><span class="t-label">EPISODE 07 · THE IDEA</span></div>
      <div id="s1-t" class="row lat nowrap">AUTOMATE</div>
      <div id="s1-sub" class="row t-h3 muted" data-layout-allow-overlap><span class="mask"><span class="in" id="s1-subi">حوّل أي فكرة لنظام</span></span></div>
      <div id="s1-st" class="stamp">جاهز</div>
      <div id="s1-num" class="row num" data-layout-allow-overlap><span id="s1-n">٠</span></div>
      <div id="s1-numl" class="row t-h3" data-layout-allow-overlap><span class="mask"><span class="in" id="s1-nl">خطوات بس</span></span></div>
    </div>
  </div>
  <script>
    (function () {
      const fx = window.HF_SCENE(0);
      fx.drift("#s1-bgp", 0, 5.9, 50, -40);
      fx.drift("#s1-blob", 0, 5.9, -120, 80);
      fx.punch("#s1-cam", 0, 1.15);
      fx.pop("#s1-glow", 0.1, { from: 0.4, d: 0.9, e: "power2.out" });
      fx.rise("#s1-lab", 0.3, { y: 20 });
      fx.letterDrop("#s1-t", 0.45);
      fx.maskUp("#s1-subi", 1.3);
      fx.stamp("#s1-st", 2.2, "#s1-cam");
      fx.counter("#s1-n", 3.0, 3.8, 0, 6);
      fx.maskUp("#s1-nl", 3.9);
      fx.zoomThrough("#s1-cam", 5.45);
      window.__timelines["s1"] = fx.tl.real;
    })();
  </script>
</template></body></html>
