<!doctype html>
<html lang="ar"><head><meta charset="UTF-8" /></head><body>
<template id="s4-template">
  <style>

    .cv-abs { position: absolute; }
    .cv-head { position: absolute; left: 50px; right: 50px; text-align: center; font-weight: 900; line-height: 1.25; white-space: nowrap; }
    .cv-chip { position: absolute; display: inline-flex; align-items: center; gap: 16px; height: 96px; padding: 0 40px; border-radius: 48px;
      font-size: 46px; font-weight: 900; white-space: nowrap; box-shadow: 0 16px 34px rgba(0,0,0,.35); }
    .cv-lat { font-family: var(--font-en); direction: ltr; unicode-bidi: isolate; }
    .cv-tag { position: absolute; font-family: var(--font-en); font-weight: 900; letter-spacing: .18em; font-size: 30px; direction: ltr; white-space: nowrap; }
    .cv-card { position: absolute; border-radius: 30px; background: #fbfbf7; color: #0d0d0d; box-shadow: 0 24px 50px rgba(0,0,0,.4); overflow: hidden; }
    .cv-floor { position: absolute; left: 0; right: 0; bottom: 0; }
    .cv-mount { position: absolute; }

    #s4-sky { position:absolute; inset:0; background: radial-gradient(ellipse 90% 70% at 50% 40%, #0d2e29 0%, #041614 70%); }
    #s4-morn { position:absolute; inset:0; background: linear-gradient(180deg, #ffec5c 0%, #f6f4ea 45%, #eceee0 100%); opacity:0; }
    #s4-clock { position:absolute; left:340px; top:300px; width:400px; height:400px; }
    #s4-am { left:0; right:0; top:730px; text-align:center; font-size:96px; color:#ffec5c; letter-spacing:.08em; }
    #s4-list { left:250px; top:600px; width:760px; direction:ltr; }
    #s4-list .r { height:104px; display:flex; align-items:center; gap:22px; padding:0 34px; border-bottom:2px solid #e3e6d6;
      font-family:var(--font-en); font-weight:800; font-size:34px; color:#2f4741; }
    #s4-list .r i { width:34px; height:40px; border-radius:6px; background:#c9cfc0; display:block; }
    #s4-list .hd { height:90px; background:#0d2b23; color:#b3ce65; display:flex; align-items:center; padding:0 34px; font-family:var(--font-en); font-weight:900; font-size:30px; letter-spacing:.14em; }
    #s4-hit { position:absolute; left:0; right:0; top:402px; height:104px; background:rgba(255,90,51,.25); border:5px solid #ff5a33; opacity:0; }
    #s4-bot { position:absolute; left:20px; top:560px; width:300px; height:360px; }
    #s4-key { position:absolute; left:820px; top:1020px; width:150px; height:66px; }
    #s4-ha { left:40px; top:470px; color:#ff5a33; font-size:64px; transform:rotate(-8deg); }
    #s4-k { left:250px; top:920px; width:582px; height:640px; }
    #s4-msg { left:70px; top:330px; width:940px; padding:34px 40px; text-align:right; }
    #s4-msg .who { display:flex; align-items:center; gap:20px; font-size:36px; font-weight:900; color:#136052; margin-bottom:16px; }
    #s4-msg .who i { width:70px; height:70px; border-radius:50%; background:#136052; display:block; }
    #s4-msg .tx { font-size:44px; font-weight:800; line-height:1.5; }
    #s4-inv { left:610px; top:640px; width:400px; padding:30px; transform:rotate(6deg); text-align:center; }
    #s4-inv b { display:block; font-size:42px; line-height:1.3; color:#2f4741; }
    #s4-inv .amt { font-size:84px; line-height:1.15; margin:10px 0; font-weight:900; color:#d93a2b; font-family:var(--font-en); }
    #s4-ring i { position:absolute; width:160px; height:160px; border-radius:50%; border:6px solid #d93a2b; opacity:0; }

  </style>
  <div id="s4" data-composition-id="s4" data-width="1080" data-height="1920" data-duration="12.0">

    <div id="s4-sky"></div>
    <div id="s4-morn"></div>
    <div id="s4-cam" class="cam">
      <div id="s4-clock"></div>
      <div id="s4-list" class="cv-card"><div class="hd">KARIM / CLINIC-APP · PUBLIC</div><div class="r"><i></i>README.md</div><div class="r"><i></i>index.html</div><div class="r"><i></i>login.js</div><div class="r"><i></i>src/payments.js</div><div class="r"><i></i>styles.css</div><div class="r"><i></i>package.json</div><div id="s4-hit"></div></div>
      <div id="s4-key"></div>
      <div id="s4-bot"></div>
      <div id="s4-k" class="cv-mount"></div>
      <div id="s4-ring"><i style="left:590px;top:1080px"></i></div>
    </div>
    <div id="s4-am" class="cv-tag">03:00 AM</div>
    <div id="s4-ha" class="cv-tag">HA HA!</div>
    <div id="s4-msg" class="cv-card"><div class="who"><i></i>صاحبي الدكتور</div><div class="tx">«كريم، المرضى بيكلموني إن بياناتهم اتسربت…»</div></div>
    <div id="s4-inv" class="cv-card"><b data-layout-allow-overlap>فاتورة</b><div class="amt" data-layout-allow-overlap>$$$$</div><b data-layout-allow-overlap>آلاف الدولارات</b></div>

  </div>
  <script>
    (function () {
      const fx = window.HF_SCENE(30.0);
      const { tl, Q } = fx;

      Q("#s4-clock").innerHTML = HF_PROP.clock("s4c");
      Q("#s4-bot").innerHTML = HF_PROP.bot("s4b", { variant: "scanner" });
      Q("#s4-key").innerHTML = HF_PROP.key("s4kk");
      const k = HF_CHAR(fx, "#s4-k", { id: "s4k", look: "karim", pose: "phone", face: "neutral", prop: "phone" });
      fx.hide("#s4-k"); fx.hide("#s4-list"); fx.hide("#s4-bot"); fx.hide("#s4-key");
      // 3:00 AM
      fx.pop("#s4-clock", 30.1, { from: 0.5 });
      tl.fromTo("#s4c-mh", { rotation: -300, svgOrigin: "110 110" }, { rotation: 0, svgOrigin: "110 110", duration: 1.0, ease: "power3.out" }, 30.15);
      tl.fromTo("#s4c-hh", { rotation: 0, svgOrigin: "110 110" }, { rotation: 90, svgOrigin: "110 110", duration: 1.0, ease: "power3.out" }, 30.15);
      fx.rise("#s4-am", 30.6, { y: 30 });
      tl.to("#s4-clock", { x: 330, y: -150, scale: 0.42, duration: 0.5, ease: "power3.inOut" }, 31.3);
      fx.out("#s4-am", 31.3);
      // the bot scans the public repo and finds the key
      tl.fromTo("#s4-list", { opacity: 0, y: 80 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out", immediateRender: false }, 31.4);
      tl.fromTo("#s4-bot", { opacity: 0, x: -300 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out", immediateRender: false }, 31.6);
      tl.fromTo("#s4-bot", { y: 0 }, { y: 312, duration: 1.6, ease: "steps(4)", immediateRender: false }, 32.0);
      tl.fromTo("#s4b-arm", { rotation: 0, svgOrigin: "46 -110" }, { rotation: -14, svgOrigin: "46 -110", duration: 0.2, yoyo: true, repeat: 7, ease: "sine.inOut" }, 32.0);
      tl.fromTo("#s4-hit", { opacity: 0 }, { opacity: 1, duration: 0.15, yoyo: true, repeat: 3, immediateRender: false }, 33.5);
      tl.fromTo("#s4-key", { opacity: 0, scale: 0.2 }, { opacity: 1, scale: 1.25, duration: 0.35, ease: "back.out(3)", immediateRender: false }, 33.6);
      tl.fromTo("#s4-bot", { scale: 1 }, { scale: 1.08, duration: 0.12, yoyo: true, repeat: 5, ease: "sine.inOut", immediateRender: false }, 34.0);
      fx.stamp("#s4-ha", 34.0);
      tl.to("#s4-key", { x: -560, y: -60, scale: 0.8, duration: 0.45, ease: "power3.in" }, 34.5);
      // morning: phone rings
      tl.fromTo("#s4-morn", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.inOut" }, 35.0);
      fx.out("#s4-list, #s4-bot, #s4-key, #s4-ha, #s4-clock", 35.0, { d: 0.35 });
      tl.fromTo("#s4-k", { opacity: 0, y: 80 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out", immediateRender: false }, 35.3);
      tl.fromTo("#s4-k", { rotation: -2 }, { rotation: 2, duration: 0.07, yoyo: true, repeat: 9, ease: "none", immediateRender: false }, 35.8);
      tl.fromTo("#s4-ring i", { opacity: 0.9, scale: 0.4 }, { opacity: 0, scale: 1.8, duration: 0.6, repeat: 2, ease: "power2.out", immediateRender: false }, 35.8);
      fx.hide("#s4-ring i");
      k.blink(35.6).face(36.4, "shock").pose(36.4, { aL: [130, 30], aR: [-26, -150], hd: 0 }, 0.25);
      fx.rise("#s4-msg", 36.3, { y: -60 });
      tl.fromTo("#s4-inv", { opacity: 0, x: 500, rotation: 30 }, { opacity: 1, x: 0, rotation: 6, duration: 0.5, ease: "back.out(1.6)", immediateRender: false }, 38.9);
      fx.hide("#s4-inv");
      k.face(39.1, "worried").hop(39.1, 18);

      window.__timelines["s4"] = tl.real;
    })();
  </script>
</template></body></html>
