      /* project-level overrides go here */
      /* NEWS:CSS:BEGIN — series styles (build_scenes.py) */
      .flap { position: absolute; left: 0; right: 0; display: flex; justify-content: center; gap: 10px; direction: ltr; }
      .fl { position: relative; display: inline-block; text-align: center; border-radius: 14px; font-family: var(--font-en); font-weight: 900; color: #f6f8f0;
        background: linear-gradient(180deg, #164a41 0%, #10392f 49.5%, #0a2924 50.5%, #0d302a 100%);
        box-shadow: 0 10px 24px rgba(0,0,0,.45), inset 0 0 0 2px rgba(255,255,255,.06); transform-origin: 50% 50%; }
      .fl::after { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 3px; margin-top: -1.5px; background: rgba(0,0,0,.45); }
      .fl.sp { background: transparent; box-shadow: none; } .fl.sp::after { display: none; }
      .fl.y { color: var(--yellow); } .fl.l { color: var(--lime); } .fl.o { color: var(--orange); }
      .co { position: absolute; left: 0; right: 0; display: flex; justify-content: center; }
      .co span { height: 64px; padding: 0 30px; border-radius: 32px; border: 3px solid var(--lime); color: var(--lime); font-family: var(--font-en);
        font-weight: 900; font-size: 28px; letter-spacing: .24em; display: flex; align-items: center; direction: ltr; white-space: nowrap; }
      .src { position: absolute; left: 0; right: 0; text-align: center; font-family: var(--font-en); font-weight: 700; font-size: 22px; letter-spacing: .14em;
        color: var(--fg-muted); direction: ltr; white-space: nowrap; }
      .src b { color: var(--lime); font-weight: 800; }
      .shot { position: absolute; border-radius: 28px; overflow: hidden; box-shadow: 0 34px 80px rgba(0,0,0,.55), 0 0 0 2px rgba(255,255,255,.1); background: #0b0b0b; }
      .shot img, .shot video { position: absolute; left: 0; top: 0; width: 100%; }
      .en { font-family: var(--font-en); direction: ltr; unicode-bidi: isolate; font-weight: 900; white-space: nowrap; }
      .y { color: var(--yellow); } .l { color: var(--lime); } .o { color: var(--orange); } .m { color: var(--fg-muted); }
      .chipn { position: absolute; height: 92px; padding: 0 36px; border-radius: 46px; background: #0b2f29; border: 3px solid rgba(179,206,101,.6);
        color: var(--fg); font-family: var(--font-ar); font-weight: 800; font-size: 40px; display: flex; align-items: center; gap: 16px; white-space: nowrap; direction: rtl; }
      .chipn .d { width: 52px; height: 52px; border-radius: 50%; background: var(--lime); color: var(--ink); display: flex; align-items: center; justify-content: center; flex: none; }
      .chipn.y { border-color: var(--yellow); } .chipn.y .d { background: var(--yellow); }
      .chipn.o { border-color: var(--orange); } .chipn.o .d { background: var(--orange); color: #fff; }
      .chipn.g { opacity: .5; filter: grayscale(1); }
      .blobby { position: absolute; border-radius: 52% 48% 50% 50% / 56% 54% 46% 44%; background: radial-gradient(circle at 38% 32%, #fff7b0 0%, var(--yellow) 42%, #f2c23a 100%);
        box-shadow: 0 30px 60px rgba(0,0,0,.4), inset -10px -16px 30px rgba(200,140,20,.35); }
      .blobby i { position: absolute; top: 40%; width: 13%; height: 17%; border-radius: 50%; background: #0d0d0d; }
      .blobby i.a { left: 30%; } .blobby i.b { left: 57%; }
      .blobby b { position: absolute; left: 41%; top: 63%; width: 18%; height: 8%; border-radius: 0 0 40px 40px; background: #0d0d0d; }
      .bar2 { position: absolute; height: 56px; border-radius: 28px; background: rgba(255,255,255,.07); overflow: hidden; }
      .bar2 > i { position: absolute; top: 0; bottom: 0; right: 0; width: 100%; border-radius: 28px; transform-origin: 100% 50%; }
      .win2 { position: absolute; border-radius: 28px; background: #0f1513; border: 2px solid rgba(255,255,255,.1); box-shadow: 0 34px 80px rgba(0,0,0,.5); overflow: hidden; }
      .win2 .bar { position: absolute; left: 0; right: 0; top: 0; height: 56px; background: #18201d; display: flex; align-items: center; gap: 12px; padding: 0 24px; direction: ltr; }
      .win2 .bar i { width: 16px; height: 16px; border-radius: 50%; background: #3a4440; }
      .win2 .bar b { margin-left: 12px; font-family: var(--font-en); font-size: 22px; font-weight: 700; color: #8fa39b; letter-spacing: .06em; }
      .tile { position: absolute; width: 120px; height: 120px; border-radius: 30px; background: #123a33; border: 2px solid rgba(179,206,101,.35); display: flex;
        align-items: center; justify-content: center; color: var(--lime); }
      .bigq { position: absolute; font-family: var(--font-ar); font-weight: 900; color: rgba(179,206,101,.06); line-height: 1; }
      #rail { position: absolute; left: 0; right: 0; bottom: 92px; z-index: 82; display: flex; justify-content: center; gap: 12px; direction: rtl; pointer-events: none; }
      #rail .rl { height: 46px; min-width: 46px; padding: 0 16px; border-radius: 23px; border: 2px solid rgba(255,255,255,.16); background: rgba(4,22,20,.72);
        font-family: var(--font-en); font-weight: 800; font-size: 20px; letter-spacing: .1em; color: var(--fg-muted); display: flex; align-items: center; justify-content: center; }
      /* NEWS:CSS:END */
      /* OPUS55:CSS:BEGIN — series styles (build_lib.py) */
      .cl-spark { position: absolute; }
      .cl-spark svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
      .cl-bloom { position: absolute; left: -70%; top: -70%; width: 240%; height: 240%; border-radius: 50%;
        background: radial-gradient(circle, rgba(217,119,87,.55) 0%, rgba(255,236,92,.14) 38%, transparent 68%); pointer-events: none; }
      .op-en { font-family: var(--font-en); direction: ltr; unicode-bidi: isolate; font-weight: 900; }
      .op-y { color: var(--yellow); } .op-l { color: var(--lime); } .op-o { color: var(--orange); } .op-c { color: #e8977c; }
      .op-tag { position: absolute; font-family: var(--font-en); font-weight: 800; letter-spacing: .2em; font-size: 24px; color: var(--lime);
        direction: ltr; white-space: nowrap; }
      .op-src { position: absolute; left: 0; right: 0; text-align: center; font-family: var(--font-en); font-weight: 700; font-size: 22px;

      .op-card { position: absolute; border-radius: 34px; background: linear-gradient(160deg, #0f3d35 0%, #082a24 100%);
        border: 3px solid rgba(179,206,101,.55); box-shadow: 0 30px 70px rgba(0,0,0,.45); overflow: hidden; }
      .op-card.back { background: repeating-linear-gradient(45deg, #0b332c 0 18px, #0d3a32 18px 36px); border-color: rgba(179,206,101,.3); }

      .op-shot { position: absolute; border-radius: 26px; overflow: hidden; box-shadow: 0 30px 80px rgba(0,0,0,.55), 0 0 0 2px rgba(255,255,255,.08); background: #111; }
      .op-shot img, .op-shot video { position: absolute; left: 0; top: 0; width: 100%; }
      .op-win { position: absolute; border-radius: 26px; overflow: hidden; background: #141414; box-shadow: 0 40px 90px rgba(0,0,0,.6), 0 0 0 2px rgba(255,255,255,.08); }
      .op-win .bar { position: absolute; left: 0; right: 0; top: 0; height: 54px; background: #1d1d1b; display: flex; align-items: center; gap: 12px; padding: 0 22px; direction: ltr; }
      .op-win .bar i { width: 16px; height: 16px; border-radius: 50%; background: #3a3a37; }

      .op-win .body { position: absolute; left: 0; right: 0; top: 54px; bottom: 0; overflow: hidden; }
      .op-win .body video, .op-win .body img { position: absolute; left: 0; top: 0; }
      /* mock Claude composer (styled after the real Claude app, dark) */
      .op-input { position: absolute; border-radius: 30px; background: #30302e; border: 2px solid #46453f; box-shadow: 0 24px 60px rgba(0,0,0,.45); }
      .op-input .txt { position: absolute; left: 34px; right: 34px; top: 30px; font-family: var(--font-ar); font-size: 40px; font-weight: 600; color: #ecebe4;

      .op-input .ph { color: #8f8d85; }
      .op-input .foot { position: absolute; left: 26px; right: 26px; bottom: 22px; height: 60px; display: flex; align-items: center; justify-content: space-between; direction: ltr; }
      .op-input .plus { font-family: var(--font-en); font-size: 40px; color: #b9b7ae; width: 54px; text-align: center; }

      .op-input .mdl em { font-style: normal; color: #8f8d85; font-weight: 600; }
      .op-input .send { width: 60px; height: 60px; border-radius: 16px; background: #D97757; display: flex; align-items: center; justify-content: center; }
      .op-input .send svg { width: 30px; height: 30px; }
      .op-chip { position: absolute; height: 82px; padding: 0 34px; border-radius: 41px; background: #0b2f29; border: 3px solid var(--lime); color: var(--fg);

      .op-chip .ic { width: 50px; height: 50px; border-radius: 50%; background: var(--lime); color: var(--ink); display: flex; align-items: center; justify-content: center;
        font-family: var(--font-en); font-weight: 900; font-size: 24px; }
      .op-chip.y { border-color: var(--yellow); } .op-chip.y .ic { background: var(--yellow); }
      .op-chip.o { border-color: var(--orange); } .op-chip.o .ic { background: var(--orange); color: #fff; }
      .op-big { position: absolute; left: 0; right: 0; text-align: center; font-family: var(--font-en); font-weight: 900; direction: ltr; white-space: nowrap; }
      .op-track { position: absolute; height: 40px; border-radius: 20px; background: rgba(255,255,255,.08); overflow: hidden; }
      .op-fill { position: absolute; top: 0; bottom: 0; right: 0; width: 100%; border-radius: 20px; transform-origin: 100% 50%; }
      .op-doc { position: absolute; border-radius: 26px; background: #f3f1e7; box-shadow: 0 30px 70px rgba(0,0,0,.45); overflow: hidden; }
      .op-doc .ln { position: absolute; right: 44px; height: 18px; border-radius: 9px; background: #c9c6b6; }
      .op-hossam { position: absolute; }
      .op-hossam img { position: absolute; left: 0; top: 0; width: 100%; filter: drop-shadow(0 30px 50px rgba(0,0,0,.55)); }
      .op-name { position: absolute; left: 0; right: 0; text-align: center; }
      .op-btn { position: absolute; height: 104px; padding: 0 56px; border-radius: 52px; background: var(--red); color: #fff; font-family: var(--font-ar); font-weight: 900;

      .op-btn.on { background: #2b2a28; border: 3px solid var(--lime); color: var(--lime); box-shadow: none; }
      .op-hl { position: absolute; border-radius: 18px; border: 6px solid var(--lime); box-shadow: 0 0 0 3000px rgba(4,22,20,.55), 0 0 40px rgba(180,207,102,.5); }
